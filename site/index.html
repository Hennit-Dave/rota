<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Rota</title>
<!-- Link host for the Rota app (ADR 0019). Static, no script, nothing from another site. -->
<style>
  :root { color-scheme: light dark; --paper:#f6f7f3; --card:#ffffff; --ink:#152e2b; --muted:#586d68; --line:#d7e0d9; --teal:#176b5b; --mint:#ddefe6; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#101e1b; --card:#1a2d27; --ink:#eaf3ed; --muted:#afbfb6; --line:#40574d; --teal:#8ad6bc; --mint:#24483d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 28rem; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  .mark { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--mint); color: var(--teal); font-weight: 700; letter-spacing: .02em; }
  h1 { margin: 16px 0 8px; font-size: 1.5rem; line-height: 1.25; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <span class="mark">Rota</span>
  <h1>Shift scheduling for small teams</h1>
  <p>Rota is a mobile app. Invitations, sign-in links and password-reset links sent by Rota open in the app on your Android phone.</p>
</main>
</body>
</html>
