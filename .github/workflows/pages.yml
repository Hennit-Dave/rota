# Publishes site/ (App Links file and the landing page for links) to GitHub Pages, served at rota.davebuilds.design (ADR 0019).
# Free: Pages on a public repo, and standard runners in a public repo, cost nothing. Runs only when site/ changes.
name: Publish link host

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the deploy if .well-known/assetlinks.json is missing or malformed: without it Android cannot verify the links.
      - name: Check the site (assetlinks.json must exist)
        run: |
          test -f site/.well-known/assetlinks.json || { echo "::error::site/.well-known/assetlinks.json is missing"; exit 1; }
          node --test site/site.test.mjs

      - uses: actions/configure-pages@v5

      # Stage what gets published, so the test file is not served. `cp -a site/. _site/` keeps .well-known.
      - name: Stage the site
        run: |
          mkdir _site
          cp -a site/. _site/
          rm _site/site.test.mjs

      # v5 or later: the include-hidden-files input does not exist in v4, which ignores it with only a warning and drops
      # .well-known (a dot-directory) while the deploy still "succeeds". That is what happened on the first deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # What was actually published, not what the workflow meant to publish: the file must be served as JSON with no redirect
      # (Android does not follow redirects when it verifies App Links). A few tries, because a new deploy takes a moment to appear.
      - name: Verify the deployed assetlinks.json
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="${BASE_URL%/}/.well-known/assetlinks.json"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o body.json -D headers.txt -w '%{http_code}' --max-redirs 0 "$url" || true)
            type=$(grep -i '^content-type:' headers.txt | head -n1 | tr -d '\r' | tr 'A-Z' 'a-z')
            if [ "$code" = "200" ] && echo "$type" | grep -q 'application/json' && grep -q '"android_app"' body.json; then
              echo "OK: $url answered 200 ($type)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, $type"
            sleep 10
          done
          echo "::error::$url is not served as application/json with a 200 and no redirect"
          exit 1
